    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cn-red': '#D91E18',
              'cn-dark-red': '#960000',
              'cn-gold': '#F4D03F',
              'cn-light-gold': '#F9E79F',
